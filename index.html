<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Engineering Intelligence Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:        #0d0f12;
    --surface:   #13161b;
    --border:    #1f2530;
    --border-hi: #2e3748;
    --text:      #c8d0dc;
    --muted:     #5a6475;
    --accent1:   #3b82f6;
    --accent2:   #22d3a0;
    --accent3:   #a78bfa;
    --accent4:   #f59e0b;
    --accent5:   #f87171;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,15,18,0.95);
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent1);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .logo span { color: var(--muted); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #status {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  #status.loading { color: var(--accent1); }
  #status.done    { color: var(--accent2); }
  #status.error   { color: var(--accent5); }
  #refresh-btn {
    font-family: var(--mono);
    font-size: 11px;
    background: none;
    border: 1px solid var(--border-hi);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: border-color .2s, color .2s;
  }
  #refresh-btn:hover { border-color: var(--accent1); color: var(--accent1); }
  #refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* TABS */
  nav {
    display: flex;
    gap: 0;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 18px 13px;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
    position: relative;
    bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--ta, var(--accent1)); }
  .tab[data-cat="all"]         { --ta: var(--text); }
  .tab[data-cat="automotive"]  { --ta: var(--accent1); }
  .tab[data-cat="space"]       { --ta: var(--accent2); }
  .tab[data-cat="gaming"]      { --ta: var(--accent3); }
  .tab[data-cat="engineering"] { --ta: var(--accent4); }
  .count-badge {
    display: inline-block;
    background: var(--border);
    color: var(--muted);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 8px;
    margin-left: 5px;
    vertical-align: middle;
    min-width: 20px;
    text-align: center;
  }

  /* MAIN */
  main { padding: 24px 28px; max-width: 1440px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* CARD GRID */
  .panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 18px;
  }

  /* FEED CARD */
  .feed-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color .2s;
  }
  .feed-card:hover { border-color: var(--border-hi); }
  .feed-card-header {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .feed-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .feed-name {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .feed-ext {
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    flex-shrink: 0;
    transition: color .15s;
  }
  .feed-ext:hover { color: var(--text); }

  .feed-body {
    flex: 1;
    overflow-y: auto;
    max-height: 300px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .feed-body::-webkit-scrollbar { width: 3px; }
  .feed-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .feed-item {
    display: block;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    transition: background .1s;
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-item:hover { background: rgba(255,255,255,0.025); }
  .item-title {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .feed-state {
    padding: 22px 14px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .feed-state.err { color: var(--accent5); }

  /* ALL PANEL */
  .all-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .all-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  #search-input {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 4px;
    outline: none;
    width: 220px;
    transition: border-color .2s;
  }
  #search-input:focus { border-color: var(--accent1); }
  #search-input::placeholder { color: var(--muted); }

  .all-list { display: flex; flex-direction: column; gap: 1px; }
  .all-item {
    display: grid;
    grid-template-columns: 8px 140px 1fr 64px;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 5px;
    text-decoration: none;
    color: inherit;
    border: 1px solid transparent;
    transition: background .1s, border-color .1s;
  }
  .all-item:hover { background: var(--surface); border-color: var(--border); }
  .all-dot { width: 7px; height: 7px; border-radius: 50%; justify-self: center; }
  .all-source {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .all-title {
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .all-date {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
  }
  .all-placeholder {
    padding: 48px;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--border);
    padding: 14px 28px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    nav, main { padding-left: 14px; padding-right: 14px; }
    .panel-grid { grid-template-columns: 1fr; }
    .all-item { grid-template-columns: 8px 1fr 56px; }
    .all-source { display: none; }
    #search-input { width: 160px; }
  }
</style>
</head>

// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
let allArticles = [];
let cardMap = {};  // url -> card element

// ─────────────────────────────────────────────────────────────────
// FETCH via rss2json (primary) → corsproxy.io + DOMParser (fallback)
// ─────────────────────────────────────────────────────────────────
async function fetchViaRss2Json(feedUrl) {
  const api = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}&count=10`;
  const r = await fetch(api, { cache: 'no-store' });
  if (!r.ok) throw new Error(`rss2json HTTP ${r.status}`);
  const d = await r.json();
  if (d.status !== 'ok') throw new Error(`rss2json: ${d.message || 'bad status'}`);
  return d.items.map(it => ({
    title: (it.title || '').replace(/<[^>]+>/g,'').trim(),
    link:  it.link || it.guid || '',
    date:  it.pubDate ? new Date(it.pubDate) : new Date(0),
  })).filter(a => a.title && a.link);
}

async function fetchViaCorsproxy(feedUrl) {
  const proxy = `https://corsproxy.io/?${encodeURIComponent(feedUrl)}`;
  const r = await fetch(proxy, { cache: 'no-store' });
  if (!r.ok) throw new Error(`corsproxy HTTP ${r.status}`);
  const text = await r.text();
  const xml = new DOMParser().parseFromString(text, 'text/xml');
  const isAtom = !!xml.querySelector('feed');
  const items  = Array.from(xml.querySelectorAll(isAtom ? 'entry' : 'item')).slice(0, 10);
  return items.map(it => {
    const title   = cdata(it.querySelector('title')?.textContent);
    const link    = isAtom
      ? (it.querySelector('link')?.getAttribute('href') || it.querySelector('link')?.textContent || '')
      : (it.querySelector('link')?.textContent || '');
    const dateStr = isAtom
      ? it.querySelector('updated,published')?.textContent
      : it.querySelector('pubDate')?.textContent;
    return { title, link: link.trim(), date: dateStr ? new Date(dateStr) : new Date(0) };
  }).filter(a => a.title && a.link);
}

async function fetchFeed(feed) {
  try {
    return await fetchViaRss2Json(feed.url);
  } catch {
    // fallback
    return await fetchViaCorsproxy(feed.url);
  }
}

function cdata(s) {
  return (s || '').replace(/<!\[CDATA\[|\]\]>/g, '').replace(/<[^>]+>/g,'').trim();
}

// ─────────────────────────────────────────────────────────────────
// RENDER CARD
// ─────────────────────────────────────────────────────────────────
function makeCard(feed) {
  const card = document.createElement('div');
  card.className = 'feed-card';
  card.innerHTML = `
    <div class="feed-card-header">
      <span class="feed-dot" style="background:${feed.color}"></span>
      <span class="feed-name">${esc(feed.name)}</span>
      <a class="feed-ext" href="${feed.home}" target="_blank" rel="noopener" title="Open source">↗</a>
    </div>
    <div class="feed-body"><div class="feed-state">Fetching…</div></div>
  `;
  return card;
}

function fillCard(card, items, errMsg) {
  const body = card.querySelector('.feed-body');
  body.innerHTML = '';
  if (errMsg) {
    body.innerHTML = `<div class="feed-state err">⚠ ${esc(errMsg)}</div>`;
    return;
  }
  if (!items || items.length === 0) {
    body.innerHTML = `<div class="feed-state">No items</div>`;
    return;
  }
  items.forEach(it => {
    const a = document.createElement('a');
    a.className = 'feed-item';
    a.href = it.link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML = `
      <div class="item-title">${esc(it.title)}</div>
      <div class="item-meta">${ago(it.date)}</div>
    `;
    body.appendChild(a);
  });
}

// ─────────────────────────────────────────────────────────────────
// BOOT / LOAD
// ─────────────────────────────────────────────────────────────────
async function bootLoad() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  allArticles = [];
  cardMap = {};

  // Reset grids
  ['automotive','space','gaming','engineering'].forEach(cat => {
    document.getElementById(`grid-${cat}`).innerHTML = '';
  });
  document.getElementById('all-list').innerHTML = '<div class="all-placeholder">Fetching feeds…</div>';
  document.getElementById('all-meta').textContent = 'Loading…';
  setStatus('loading', `Loading 0 / ${FEEDS.length}…`);

  // Create skeleton cards
  FEEDS.forEach(feed => {
    const card = makeCard(feed);
    document.getElementById(`grid-${feed.cat}`).appendChild(card);
    cardMap[feed.url] = card;
  });

  // Fetch all in parallel, update as each resolves
  let done = 0;
  const promises = FEEDS.map(async feed => {
    try {
      const items = await fetchFeed(feed);
      fillCard(cardMap[feed.url], items, null);
      items.forEach(a => allArticles.push({ ...a, source: feed.name, color: feed.color, cat: feed.cat }));
    } catch (e) {
      fillCard(cardMap[feed.url], null, 'Could not load feed');
    }
    done++;
    setStatus('loading', `Loading ${done} / ${FEEDS.length}…`);
    // Re-render all list progressively
    renderAll(document.getElementById('search-input').value);
    updateCounts();
  });

  await Promise.allSettled(promises);

  // Final sort + render
  allArticles.sort((a,b) => b.date - a.date);
  renderAll(document.getElementById('search-input').value);
  updateCounts();

  const t = new Date();
  setStatus('done', `${FEEDS.length} feeds · Updated ${fmt(t)}`);
  document.getElementById('footer-time').textContent = `Last updated: ${t.toLocaleString('en-GB')}`;
  btn.disabled = false;
}

// ─────────────────────────────────────────────────────────────────
// ALL LIST
// ─────────────────────────────────────────────────────────────────
function renderAll(query) {
  const list = document.getElementById('all-list');
  const q = (query || '').toLowerCase().trim();
  const filtered = q
    ? allArticles.filter(a => a.title.toLowerCase().includes(q) || a.source.toLowerCase().includes(q))
    : allArticles;

  document.getElementById('all-meta').textContent =
    q ? `${filtered.length} results for "${q}"` : `${allArticles.length} articles across ${FEEDS.length} feeds`;

  list.innerHTML = '';
  if (filtered.length === 0) {
    list.innerHTML = '<div class="all-placeholder">No articles found.</div>';
    return;
  }
  filtered.forEach(a => {
    const el = document.createElement('a');
    el.className = 'all-item';
    el.href = a.link;
    el.target = '_blank';
    el.rel = 'noopener';
    el.innerHTML = `
      <span class="all-dot" style="background:${a.color}"></span>
      <span class="all-source">${esc(a.source)}</span>
      <span class="all-title">${esc(a.title)}</span>
      <span class="all-date">${ago(a.date)}</span>
    `;
    list.appendChild(el);
  });
}

function filterAll(q) {
  renderAll(q);
}

// ─────────────────────────────────────────────────────────────────
// COUNTS
// ─────────────────────────────────────────────────────────────────
function updateCounts() {
  const cats = ['automotive','space','gaming','engineering'];
  let total = allArticles.length;
  cats.forEach(cat => {
    const n = allArticles.filter(a => a.cat === cat).length;
    const el = document.getElementById(`cnt-${cat}`);
    if (el) el.textContent = n || '—';
  });
  const el = document.getElementById('cnt-all');
  if (el) el.textContent = total || '—';
}

// ─────────────────────────────────────────────────────────────────
// TABS
// ─────────────────────────────────────────────────────────────────
function switchTab(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`panel-${btn.dataset.cat}`).classList.add('active');
}

// ─────────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────────
function setStatus(cls, msg) {
  const el = document.getElementById('status');
  el.className = cls;
  el.textContent = msg;
}

function ago(date) {
  if (!(date instanceof Date) || isNaN(date)) return '—';
  const d = Date.now() - date.getTime();
  if (d < 0) return 'just now';
  const m = Math.floor(d/60000);
  if (m < 1)  return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if (h < 24) return `${h}h ago`;
  const dy = Math.floor(h/24);
  if (dy < 7) return `${dy}d ago`;
  return date.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function fmt(d) {
  return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────────────────────────
// START
// ─────────────────────────────────────────────────────────────────
bootLoad();
</script>
