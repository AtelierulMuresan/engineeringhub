<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Engineering Intelligence Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:        #0d0f12;
    --surface:   #13161b;
    --border:    #1f2530;
    --border-hi: #2e3748;
    --text:      #c8d0dc;
    --muted:     #5a6475;
    --accent1:   #3b82f6;   /* blue  — automotive / engineering */
    --accent2:   #22d3a0;   /* teal  — space / physics          */
    --accent3:   #a78bfa;   /* violet — gaming                  */
    --accent4:   #f59e0b;   /* amber — general engineering      */
    --accent5:   #f87171;   /* red   — breaking / new           */
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,15,18,0.92);
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent1);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .logo span { color: var(--muted); font-weight: 400; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #status {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  #status.loading { color: var(--accent1); }
  #status.done    { color: var(--accent2); }
  #refresh-btn {
    font-family: var(--mono);
    font-size: 11px;
    background: none;
    border: 1px solid var(--border-hi);
    color: var(--muted);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: border-color .2s, color .2s;
  }
  #refresh-btn:hover { border-color: var(--accent1); color: var(--accent1); }

  /* ── TAB NAV ── */
  nav {
    display: flex;
    gap: 2px;
    padding: 16px 28px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  .tab {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 16px 10px;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
    position: relative;
    bottom: -1px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--tab-accent, var(--accent1)); }
  .tab[data-cat="automotive"]  { --tab-accent: var(--accent1); }
  .tab[data-cat="space"]       { --tab-accent: var(--accent2); }
  .tab[data-cat="gaming"]      { --tab-accent: var(--accent3); }
  .tab[data-cat="engineering"] { --tab-accent: var(--accent4); }
  .tab[data-cat="all"]         { --tab-accent: var(--text);    }

  .tab .count {
    display: inline-block;
    background: var(--border);
    color: var(--muted);
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 10px;
    margin-left: 5px;
    vertical-align: middle;
  }

  /* ── MAIN LAYOUT ── */
  main {
    padding: 24px 28px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* ── FEED PANELS ── */
  .panel { display: none; }
  .panel.active { display: block; }

  .panel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  /* ── FEED CARD ── */
  .feed-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .feed-card-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .feed-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .feed-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .feed-link-btn {
    font-size: 10px;
    color: var(--muted);
    text-decoration: none;
    font-family: var(--mono);
    flex-shrink: 0;
    transition: color .15s;
  }
  .feed-link-btn:hover { color: var(--text); }

  .feed-items {
    padding: 8px 0;
    flex: 1;
    overflow-y: auto;
    max-height: 320px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .feed-items::-webkit-scrollbar { width: 4px; }
  .feed-items::-webkit-scrollbar-track { background: transparent; }
  .feed-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .feed-item {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: block;
    text-decoration: none;
    color: inherit;
    transition: background .12s;
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-item:hover { background: rgba(255,255,255,0.03); }
  .feed-item-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .feed-item-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }

  .feed-loading, .feed-error, .feed-empty {
    padding: 24px 16px;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .feed-error { color: var(--accent5); }

  /* ── ALL PANEL — flat list sorted by date ── */
  .all-list { display: flex; flex-direction: column; gap: 2px; }
  .all-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 9px 14px;
    border-radius: 6px;
    text-decoration: none;
    color: inherit;
    border: 1px solid transparent;
    transition: background .12s, border-color .12s;
  }
  .all-item:hover { background: var(--surface); border-color: var(--border); }
  .all-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .all-source {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
    width: 130px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .all-title {
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .all-date {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .all-loading {
    text-align: center;
    padding: 60px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 16px 28px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    nav { padding: 12px 16px 0; }
    main { padding: 16px; }
    .panel-grid { grid-template-columns: 1fr; }
    .all-source { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Engineering<span> // </span>Intelligence Hub</div>
  <div class="header-right">
    <span id="status">ready</span>
    <button id="refresh-btn" onclick="loadAll()">↺ Refresh</button>
  </div>
</header>

<nav id="tab-nav">
  <button class="tab active" data-cat="all"         onclick="switchTab(this)">All Feeds <span class="count" id="cnt-all">—</span></button>

  <button class="tab"        data-cat="gaming"      onclick="switchTab(this)">Gaming <span class="count" id="cnt-gaming">—</span></button>
  <button class="tab"        data-cat="engineering" onclick="switchTab(this)">Engineering <span class="count" id="cnt-engineering">—</span></button>
</nav>

<main>

  </div>

  </div>

  <!-- GAMING PANEL -->

  </div>

  <!-- ENGINEERING PANEL -->

</main>

<footer>
  Engineering Intelligence Hub &nbsp;·&nbsp; Built by Raducu &nbsp;·&nbsp; Feeds update on each page load &nbsp;·&nbsp; <span id="last-updated"></span>
</footer>

// ──────────────────────────────────────────────

  { cat:'space', color:'var(--accent2)', name:'NASA Aeronautics',       url:'https://www.nasa.gov/aeronautics/feed/',                         home:'https://www.nasa.gov/aeronautics/' },
  { cat:'space', color:'var(--accent2)', name:'ESA Top News',           url:'https://www.esa.int/rssfeed/TopNews',                            home:'https://www.esa.int/Newsroom' },
  { cat:'space', color:'var(--accent2)', name:'Space.com',              url:'https://www.space.com/home/feed/site.xml',                       home:'https://www.space.com' },

  { cat:'gaming', color:'var(--accent3)', name:'Rock Paper Shotgun',url:'https://www.rockpapershotgun.com/feed',              home:'https://www.rockpapershotgun.com' },
  { cat:'gaming', color:'var(--accent3)', name:'PC Gamer',          url:'https://www.pcgamer.com/rss/',                       home:'https://www.pcgamer.com' },
  { cat:'gaming', color:'var(--accent3)', name:'PlayStation Blog',  url:'https://blog.playstation.com/feed',                  home:'https://blog.playstation.com' },
  { cat:'gaming', color:'var(--accent3)', name:'Xbox Wire',         url:'https://news.xbox.com/en-us/feed/',                  home:'https://news.xbox.com/en-us/' },
  { cat:'gaming', color:'var(--accent3)', name:'GamesIndustry.biz', url:'https://www.gamesindustry.biz/feed',                 home:'https://www.gamesindustry.biz' },
  { cat:'gaming', color:'var(--accent3)', name:'Game Developer',    url:'https://www.gamedeveloper.com/rss.xml',              home:'https://www.gamedeveloper.com' },

  // ── GENERAL ENGINEERING ──
  { cat:'engineering', color:'var(--accent4)', name:'IEEE Spectrum',          url:'https://spectrum.ieee.org/feeds/feed.rss',                          home:'https://spectrum.ieee.org' },
  { cat:'engineering', color:'var(--accent4)', name:'Interesting Engineering',url:'https://interestingengineering.com/feed',                            home:'https://interestingengineering.com' },
  { cat:'engineering', color:'var(--accent4)', name:'The Engineer (UK)',      url:'https://www.theengineer.co.uk/feed',                                 home:'https://www.theengineer.co.uk' },
  { cat:'engineering', color:'var(--accent4)', name:'ScienceDaily Engineering',url:'https://www.sciencedaily.com/rss/matter_energy/engineering.xml',   home:'https://www.sciencedaily.com/news/matter_energy/engineering/' },
  { cat:'engineering', color:'var(--accent4)', name:'Design News',            url:'https://www.designnews.com/rss',                                     home:'https://www.designnews.com' },
  { cat:'engineering', color:'var(--accent4)', name:'MIT Technology Review',  url:'https://www.technologyreview.com/feed/',                             home:'https://www.technologyreview.com' },
  { cat:'engineering', color:'var(--accent4)', name:'Ars Technica',           url:'https://feeds.arstechnica.com/arstechnica/index',                    home:'https://arstechnica.com' },
  { cat:'engineering', color:'var(--accent4)', name:'Quanta — Technology',    url:'https://www.quantamagazine.org/technology/feed',                     home:'https://www.quantamagazine.org/technology/' },
  { cat:'engineering', color:'var(--accent4)', name:'Electronic Design',      url:'https://www.electronicdesign.com/rss',                               home:'https://www.electronicdesign.com' },
  { cat:'engineering', color:'var(--accent4)', name:'ENR',                    url:'https://www.enr.com/rss/articles',                                   home:'https://www.enr.com' },
];

// ──────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────
const allArticles = [];   // { title, link, date, source, color, cat }
let loaded = 0;
let failed = 0;

// ──────────────────────────────────────────────
// RSS via allorigins CORS proxy → rss2json convert
// ──────────────────────────────────────────────
async function fetchFeed(feed) {
  const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(feed.url)}`;
  const res = await fetch(proxy, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  const xml = new DOMParser().parseFromString(data.contents, 'text/xml');

  // Support RSS 2.0 and Atom
  const isAtom = xml.querySelector('feed') !== null;
  const items = isAtom
    ? Array.from(xml.querySelectorAll('entry')).slice(0, 8)
    : Array.from(xml.querySelectorAll('item')).slice(0, 8);

  return items.map(item => {
    const title = (item.querySelector('title')?.textContent || '').trim().replace(/\]\]>|<!\[CDATA\[/g,'');
    const link = isAtom
      ? (item.querySelector('link')?.getAttribute('href') || item.querySelector('link')?.textContent || '')
      : (item.querySelector('link')?.textContent || '');
    const dateStr = isAtom
      ? item.querySelector('updated,published')?.textContent
      : item.querySelector('pubDate')?.textContent;
    const date = dateStr ? new Date(dateStr) : new Date(0);
    return { title, link: link.trim(), date, source: feed.name, color: feed.color, cat: feed.cat };
  }).filter(a => a.title && a.link);
}

// ──────────────────────────────────────────────
// BUILD CARD
// ──────────────────────────────────────────────
function makeCard(feed, items, error) {
  const card = document.createElement('div');
  card.className = 'feed-card';

  const hdr = document.createElement('div');
  hdr.className = 'feed-card-header';
  hdr.innerHTML = `
    <span class="feed-dot" style="background:${feed.color}"></span>
    <span class="feed-title">${feed.name}</span>
    <a class="feed-link-btn" href="${feed.home}" target="_blank" rel="noopener">↗</a>
  `;
  card.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'feed-items';

  if (error) {
    body.innerHTML = `<div class="feed-error">Could not load feed</div>`;
  } else if (!items || items.length === 0) {
    body.innerHTML = `<div class="feed-empty">No items found</div>`;
  } else {
    items.forEach(it => {
      const el = document.createElement('a');
      el.className = 'feed-item';
      el.href = it.link;
      el.target = '_blank';
      el.rel = 'noopener';
      const ago = timeAgo(it.date);
      el.innerHTML = `
        <div class="feed-item-title">${escHtml(it.title)}</div>
        <div class="feed-item-meta">${ago}</div>
      `;
      body.appendChild(el);
    });
  }
  card.appendChild(body);
  return card;
}

// ──────────────────────────────────────────────
// LOAD ALL FEEDS
// ──────────────────────────────────────────────
async function loadAll() {
  // Reset state
  allArticles.length = 0;
  loaded = 0; failed = 0;
  updateStatus('loading', `Loading 0 / ${FEEDS.length}…`);

  // Clear grids
  ['automotive','space','gaming','engineering'].forEach(cat => {
    document.getElementById(`grid-${cat}`).innerHTML = '';
  });
  document.getElementById('all-list').innerHTML = '<div class="all-loading">Loading all feeds…</div>';

  // Build skeleton cards immediately
  FEEDS.forEach(feed => {
    const grid = document.getElementById(`grid-${feed.cat}`);
    const card = makeCard(feed, null, false);
    card.querySelector('.feed-items').innerHTML = '<div class="feed-loading">Fetching…</div>';
    card.dataset.feedUrl = feed.url;
    grid.appendChild(card);
  });

  // Fetch all in parallel
  const results = await Promise.allSettled(FEEDS.map(f => fetchFeed(f)));

  results.forEach((result, i) => {
    const feed = FEEDS[i];
    const grid = document.getElementById(`grid-${feed.cat}`);
    const card = Array.from(grid.children).find(c => c.dataset.feedUrl === feed.url);

    if (result.status === 'fulfilled') {
      const items = result.value;
      loaded++;
      // Replace skeleton card
      const newCard = makeCard(feed, items, false);
      newCard.dataset.feedUrl = feed.url;
      grid.replaceChild(newCard, card);
      // Add to global list
      items.forEach(a => allArticles.push(a));
    } else {
      failed++;
      const newCard = makeCard(feed, null, true);
      newCard.dataset.feedUrl = feed.url;
      grid.replaceChild(newCard, card);
    }

    updateStatus('loading', `Loading ${loaded + failed} / ${FEEDS.length}…`);
  });

  // Sort all articles by date desc, render
  allArticles.sort((a,b) => b.date - a.date);
  renderAllList();

  // Update counts
  updateCounts();
  updateStatus('done', `${loaded} feeds loaded · ${failed} failed · ${formatTime(new Date())}`);
  document.getElementById('last-updated').textContent = `Last updated: ${formatTime(new Date())}`;
}

function renderAllList() {
  const list = document.getElementById('all-list');
  list.innerHTML = '';
  if (allArticles.length === 0) {
    list.innerHTML = '<div class="all-loading">No articles loaded.</div>';
    return;
  }
  allArticles.forEach(a => {
    const el = document.createElement('a');
    el.className = 'all-item';
    el.href = a.link;
    el.target = '_blank';
    el.rel = 'noopener';
    el.innerHTML = `
      <span class="all-dot" style="background:${a.color}"></span>
      <span class="all-source">${escHtml(a.source)}</span>
      <span class="all-title">${escHtml(a.title)}</span>
      <span class="all-date">${timeAgo(a.date)}</span>
    `;
    list.appendChild(el);
  });
}

function updateCounts() {
  const cats = ['automotive','space','gaming','engineering'];
  let total = 0;
  cats.forEach(cat => {
    const n = allArticles.filter(a => a.cat === cat).length;
    total += n;
    const el = document.getElementById(`cnt-${cat}`);
    if (el) el.textContent = n;
  });
  const allEl = document.getElementById('cnt-all');
  if (allEl) allEl.textContent = total;
}

// ──────────────────────────────────────────────
// TABS
// ──────────────────────────────────────────────
function switchTab(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(`panel-${btn.dataset.cat}`).classList.add('active');
}

// ──────────────────────────────────────────────
// HELPERS
// ──────────────────────────────────────────────
function updateStatus(cls, msg) {
  const el = document.getElementById('status');
  el.className = cls;
  el.textContent = msg;
}

function timeAgo(date) {
  if (!(date instanceof Date) || isNaN(date)) return '—';
  const diff = Date.now() - date.getTime();
  if (diff < 0) return 'just now';
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  return date.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

function formatTime(d) {
  return d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ──────────────────────────────────────────────
// BOOT
// ──────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
